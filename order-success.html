<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopSphere | Order Successful</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="style.css">


    <link
        rel="stylesheet"
        href="success.css">

</head>


<body>


<!-- =====================================================
                    NAVBAR
===================================================== -->

<nav class="navbar navbar-expand-lg bg-white border-bottom">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            <i class="bi bi-bag-fill"></i>

            ShopSphere

        </a>


        <div class="navbar-actions ms-auto">

            <a
                href="products.html"
                class="continue-shopping-nav">

                Continue Shopping

            </a>

        </div>

    </div>

</nav>



<!-- =====================================================
                SUCCESS SECTION
===================================================== -->

<section class="success-section">

    <div class="container">

        <div class="success-card">


            <div class="success-icon">

                <i class="bi bi-check-lg"></i>

            </div>


            <span class="success-label">
                ORDER CONFIRMED
            </span>


            <h1>
                Thank You For Your Order!
            </h1>


            <p>
                Your order has been successfully placed.
                We'll get your items ready for delivery.
            </p>


            <!-- ORDER NUMBER -->

            <div class="order-number-box">

                <span>
                    Order Number
                </span>

                <strong id="orderNumber">
                    #SS00000000
                </strong>

            </div>



            <!-- ORDER INFO -->

            <div class="success-info">


                <div>

                    <i class="bi bi-person"></i>

                    <span>
                        Customer
                    </span>

                    <strong id="customerName">
                        -
                    </strong>

                </div>


                <div>

                    <i class="bi bi-truck"></i>

                    <span>
                        Delivery
                    </span>

                    <strong id="deliveryMethod">
                        -
                    </strong>

                </div>


                <div>

                    <i class="bi bi-credit-card"></i>

                    <span>
                        Payment
                    </span>

                    <strong id="paymentMethod">
                        -
                    </strong>

                </div>


                <div>

                    <i class="bi bi-currency-rupee"></i>

                    <span>
                        Total
                    </span>

                    <strong id="orderTotal">
                        ₹0
                    </strong>

                </div>


            </div>



            <!-- BUTTONS -->

            <div class="success-buttons">

                <a
                    href="products.html"
                    class="primary-success-btn">

                    Continue Shopping

                    <i class="bi bi-arrow-right"></i>

                </a>


                <a
                    href="index.html"
                    class="secondary-success-btn">

                    Back to Home

                </a>

            </div>


        </div>

    </div>

</section>



<script src="success.js"></script>
<script src="auth.js"></script>

</body>

</html>
