<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopSphere | Login</title>


    <!-- =====================================================
                        BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- =====================================================
                    BOOTSTRAP ICONS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- =====================================================
                        GOOGLE FONT
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- =====================================================
                        MAIN CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css">


    <!-- =====================================================
                        LOGIN CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="login.css">

</head>


<body>


<!-- =====================================================
                        NAVBAR
===================================================== -->

<nav class="navbar navbar-expand-lg bg-white border-bottom">

    <div class="container">

        <!-- LOGO -->

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            <i class="bi bi-bag-fill"></i>

            ShopSphere

        </a>


        <!-- MOBILE TOGGLE -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu"
            aria-controls="navbarMenu"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- NAVIGATION -->

        <div
            class="collapse navbar-collapse"
            id="navbarMenu">


            <ul class="navbar-nav mx-auto">


                <!-- HOME -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html">

                        Home

                    </a>

                </li>


                <!-- SHOP -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="products.html">

                        Shop

                    </a>

                </li>


                <!-- WOMEN -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="products.html?category=Women">

                        Women

                    </a>

                </li>


                <!-- MEN -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="products.html?category=Men">

                        Men

                    </a>

                </li>


                <!-- ACCESSORIES -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="products.html?category=Accessories">

                        Accessories

                    </a>

                </li>

            </ul>


            <!-- =================================================
                            NAV ACTIONS
            ================================================== -->

            <div class="navbar-actions">


                <!-- WISHLIST -->

                <a
                    href="wishlist.html"
                    class="nav-icon">

                    <i class="bi bi-heart"></i>

                    <span id="wishlistCount">
                        0
                    </span>

                </a>


                <!-- CART -->

                <a
                    href="cart.html"
                    class="nav-icon">

                    <i class="bi bi-bag"></i>

                    <span id="cartCount">
                        0
                    </span>

                </a>


                <!-- LOGIN -->

                <a
                    href="login.html"
                    class="login-btn active">

                    Login

                </a>

            </div>

        </div>

    </div>

</nav>



<!-- =====================================================
                    LOGIN SECTION
===================================================== -->

<section class="login-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7 col-sm-10">


                <!-- =================================================
                            LOGIN CARD
                ================================================== -->

                <div class="login-card">


                    <!-- LOGIN HEADER -->

                    <div class="login-header">

                        <div class="login-icon">

                            <i class="bi bi-person"></i>

                        </div>


                        <span class="section-label">
                            WELCOME BACK
                        </span>


                        <h1>
                            Login to ShopSphere
                        </h1>


                        <p>
                            Sign in to continue shopping with us.
                        </p>

                    </div>



                    <!-- =================================================
                                LOGIN FORM
                    ================================================== -->

                    <form id="loginForm">


                        <!-- EMAIL -->

                        <div class="form-group">

                            <label for="loginEmail">
                                Email Address
                            </label>


                            <div class="input-wrapper">

                                <i class="bi bi-envelope"></i>

                                <input
                                    type="email"
                                    id="loginEmail"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    autocomplete="email"
                                    required>

                            </div>

                        </div>



                        <!-- PASSWORD -->

                        <div class="form-group">

                            <div class="password-label">

                                <label for="loginPassword">
                                    Password
                                </label>


                                <a
                                    href="#"
                                    id="forgotPassword">

                                    Forgot Password?

                                </a>

                            </div>


                            <div class="input-wrapper">

                                <i class="bi bi-lock"></i>

                                <input
                                    type="password"
                                    id="loginPassword"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required>


                                <!-- SHOW PASSWORD -->

                                <button
                                    type="button"
                                    class="password-toggle"
                                    id="togglePassword"
                                    aria-label="Show password">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>



                        <!-- REMEMBER ME -->

                        <div class="remember-row">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="rememberMe">


                                <label
                                    class="form-check-label"
                                    for="rememberMe">

                                    Remember me

                                </label>

                            </div>

                        </div>



                        <!-- LOGIN BUTTON -->

                        <button
                            type="submit"
                            class="login-submit-btn">

                            Login

                            <i class="bi bi-arrow-right"></i>

                        </button>



                        <!-- MESSAGE -->

                        <div
                            id="loginMessage"
                            class="login-message"
                            role="alert">

                        </div>


                    </form>



                    <!-- =================================================
                            DIVIDER
                    ================================================== -->

                    <div class="login-divider">

                        <span>
                            OR
                        </span>

                    </div>



                    <!-- =================================================
                            SIGNUP
                    ================================================== -->

                    <div class="signup-link">

                        <p>
                            Don't have an account?
                        </p>


                        <a
                            href="signup.html">

                            Create an Account

                            <i class="bi bi-arrow-right"></i>

                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>

</section>



<!-- =====================================================
                        FOOTER
===================================================== -->

<footer class="login-footer">

    <div class="container">

        <p>
            © 2026 ShopSphere. All rights reserved.
        </p>

    </div>

</footer>



<!-- =====================================================
                    BOOTSTRAP JS
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- =====================================================
                        LOGIN JS
===================================================== -->

<script src="login.js"></script>
<script src="auth.js"></script>


</body>

</html>
