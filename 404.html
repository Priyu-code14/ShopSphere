<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"

    <title>ShopSphere | Page Not Found</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"

    <!-- Main CSS -->

    <link

===================================================== -->

<nav class="navbar navbar-expand-lg bg-white border-bottom">

        <a
            class="navbar-brand fw-bold"

            <i class="bi bi-bag-fill"></i>

            ShopSphere

        </a>



        <!-- MOBILE BUTTON -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>



        <!-- NAVIGATION -->

        <div
            class="collapse navbar-collapse"
            id="navbarMenu">


            <ul class="navbar-nav mx-auto">


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html">

                        Home

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="products.html">

                        Shop

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="products.html?category=Women">

                        Women

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="products.html?category=Men">

                        Men

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="products.html?category=Accessories">

                        Accessories

                    </a>

                </li>

            </ul>



            <!-- NAV ACTIONS -->

            <div class="navbar-actions">


                <a
                    href="wishlist.html"
                    class="nav-icon">

                    <i class="bi bi-heart"></i>

                    <span id="wishlistCount">
                        0
                    </span>

                </a>



                <a
                    href="cart.html"
                    class="nav-icon">

                    <i class="bi bi-bag"></i>

                    <span id="cartCount">
                        0
                    </span>

                </a>



                <a
                    href="login.html"
                    class="login-btn">

                    Login

                </a>

            </div>

        </div>

    </div>

</nav>



<!-- =====================================================
                    404 SECTION
===================================================== -->

<section class="error-section">

    <div class="container">

        <div class="error-content">


            <!-- ERROR ICON -->

            <div class="error-icon">

                <i class="bi bi-bag-x"></i>

            </div>



            <!-- 404 -->

            <div class="error-number">

                404

            </div>



            <span class="error-label">

                PAGE NOT FOUND

            </span>



            <h1>

                Oops! This Page Went Missing.

            </h1>



            <p>

                The page you're looking for doesn't exist,
                has been moved, or may no longer be available.

            </p>



            <!-- BUTTONS -->

            <div class="error-buttons">


                <a
                    href="index.html"
                    class="error-primary-btn">

                    <i class="bi bi-house-door"></i>

                    Back to Home

                </a>



                <a
                    href="products.html"
                    class="error-secondary-btn">

                    Shop Now

                    <i class="bi bi-arrow-right"></i>

                </a>

            </div>



            <!-- EXTRA LINK -->

            <a
                href="javascript:history.back()"
                class="back-link">

                <i class="bi bi-arrow-left"></i>

                Go Back

            </a>


        </div>

    </div>

</section>



<!-- =====================================================
                        FOOTER
===================================================== -->

<footer class="error-footer">

    <div class="container">

        <p>

            © 2026 ShopSphere.
            All rights reserved.

        </p>

    </div>

</footer>



<!-- Bootstrap JS -->
